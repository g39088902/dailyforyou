version: "3.8"

services:
  DailyForYouUser:
    build:
      context: .
      target: runner
    ports:
      - "6690:6690"
    volumes:
      - "./logs:/app/logs"
      - "./data:/app/data"
    environment:
      - PORT=6690
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - DEFAULT_USER_ADDRESS=${DEFAULT_USER_ADDRESS:-}
    user: "114514"
    restart: always
